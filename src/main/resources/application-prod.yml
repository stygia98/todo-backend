# 운영 프로파일 (AWS RDS)
# 실행: java -jar app.jar --spring.profiles.active=prod
# 공통 설정(application.yml)에 병합되며, 같은 키만 덮어쓴다.
spring:
  datasource:
    # RDS 엔드포인트. 기본값을 두지 않는다 — 미설정 시 조용히 로컬에 붙는 사고를 막는다.
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      # 운영은 스키마를 자동 변경하지 않는다. 엔티티와 실제 테이블이 다르면 기동에 실패한다.
      # 스키마는 Phase 11에서 DDL 스크립트를 추출해 RDS에 1회 수동 적용한다 (CLAUDE.md 4장).
      ddl-auto: validate
    # 운영에서는 SQL을 로그로 남기지 않는다.
    show-sql: false

logging:
  level:
    org.hibernate: warn
    org.hibernate.SQL: warn

app:
  storage:
    # S3StorageService(@ConditionalOnProperty)가 이 값으로 활성화된다.
    type: s3
    local:
      # ⚠️ LocalStorageService 는 storage.type 값과 무관하게 항상 @Component 로 등록된다
      # (과거 storage_type=LOCAL 레코드 조회를 위해 — 4장 참조). 신규 업로드는 S3로 가지만
      # 빈 생성 자체에는 이 값이 필요하므로, 운영에서도 반드시 설정해야 한다.
      base-dir: ${LOCAL_UPLOAD_DIR}
      base-url: ${BACKEND_BASE_URL}
    s3:
      # S3 콘솔 설정(버킷 CORS·Block Public Access·IAM 정책)은 Phase 14 "AWS 콘솔 설정" 태스크에서
      # 완료했다. 실제 버킷명·리전은 하드코딩하지 않고 환경변수로만 주입한다.
      bucket: ${AWS_S3_BUCKET}
      region: ${AWS_REGION:ap-northeast-2}
