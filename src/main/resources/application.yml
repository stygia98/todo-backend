# 공통 설정 (모든 프로파일이 공유한다)
# 환경마다 달라지는 값(DB 접속, ddl-auto)은 application-{프로파일}.yml 에 둔다.

server:
  # X-Forwarded-Host/Port 등을 신뢰해 request 기반으로 만드는 절대경로 URL(첨부 조회 등)이
  # 올바른 호스트를 가리키게 한다. 로컬(프록시 없음)은 헤더 자체가 없어 영향 없다.
  #
  # ⚠️ X-Forwarded-Proto는 이 설정과 무관하게 별도로 대응한다. CloudFront 커스텀 오리진 헤더로
  # X-Forwarded-Proto: https를 등록해도 실제로는 오리진에 전달되지 않는 것을 확인했다
  # (2026-09-10, /api/v1/debug/headers로 직접 검증 — X-Forwarded-For는 오는데 Proto만 없음).
  # 그래서 OAuth2 redirect-uri는 request 기반 추론에 기대지 않고 application-prod.yml에서
  # OAUTH2_REDIRECT_BASE_URL로 직접 고정한다.
  forward-headers-strategy: framework

spring:
  application:
    name: todo-backend

  profiles:
    # 기본 프로파일. 지정하지 않으면 DB 접속 정보 없이 기동을 시도해 실패한다.
    # 운영에서는 실행 시 --spring.profiles.active=prod 로 덮어쓴다.
    active: local

  jpa:
    properties:
      hibernate:
        jdbc:
          # 타임존을 UTC로 고정한다. 로컬은 KST(+09:00), RDS 기본값은 UTC라
          # 설정하지 않으면 시각이 9시간 어긋난 채 배포 후에야 드러난다.
          # 저장·비교는 전부 UTC로 하고, 표시할 때만 브라우저 로컬 시각으로 변환한다.
          time_zone: UTC

  security:
    oauth2:
      client:
        registration:
          google:
            # registration id 가 google 이면 CommonOAuth2Provider.GOOGLE 프리셋이
            # authorization-uri/token-uri/user-info-uri/scope 를 자동으로 채운다.
            # provider 블록을 직접 쓰지 않는다.
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}

# Jackson 날짜 설정은 두지 않는다.
# Spring Boot 4는 Jackson 3을 쓰고 기본값이 이미 ISO-8601 문자열이므로 무설정으로 충족된다.
# Boot 3 시절의 spring.jackson.serialization.* 경로는 Boot 4에서 동작하지 않는다.

jwt:
  # 서명 알고리즘은 HS256 고정. raw UTF-8 32자 이상이어야 하며 Base64로 디코드하지 않는다.
  # 32자 문자열을 Base64 디코드하면 24바이트가 되어 WeakKeyException 으로 기동에 실패한다.
  secret: ${JWT_SECRET}
  # 24시간 (밀리초)
  expiration: ${JWT_EXPIRATION:86400000}

app:
  # OAuth2 리다이렉트의 기준 주소. 반드시 단일 URL이다.
  # {frontend-url}/oauth/callback?token=xxx 형태로 조립되므로 쉼표 목록을 넣으면 주소가 깨진다.
  frontend-url: ${FRONTEND_URL}
  cors:
    # CORS 허용 오리진. 쉼표로 구분된 목록이다.
    # 운영에서 Amplify 브랜치 도메인과 커스텀 도메인을 동시에 허용해야 하므로
    # 위의 frontend-url 과 하나로 합치지 않는다.
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  upload:
    # 5MB. presign 단계(선언값)와 수신 단계(실측값) 양쪽에서 이 상한을 검사한다.
    # 선언값은 클라이언트 주장일 뿐이므로 수신 단계가 실질적 방어다.
    max-file-size: 5242880
    allowed-content-types: image/jpeg,image/png,image/gif,image/webp
  storage:
    # 첨부 조회용 뷰 토큰의 만료 시간(밀리초, 기본 24시간). 액세스 토큰과 동일하게 둔다 —
    # 상세 화면을 열어둔 채 짧게 만료되면 "캐시된 본문 + 만료된 URL" 조합이 생겨
    # 에디터 재마운트가 필요해지고, 이는 편집 중이던 입력을 날린다(6장 참조).
    url-expiry-millis: ${ATTACHMENT_URL_EXPIRATION:86400000}
